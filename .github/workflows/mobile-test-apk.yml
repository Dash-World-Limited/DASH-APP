name: Mobile arm64 test APK

on:
  push:
    branches:
      - codex/native-mobile-stabilization
      - claude/playstore-readiness
    paths:
      - .github/workflows/mobile-test-apk.yml
      - apps/mobile/**
      - packages/domain/**
  workflow_dispatch:

concurrency:
  group: mobile-test-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-and-build:
    name: Verify and build standalone debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      APP_VARIANT: development
      NODE_ENV: development

    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json

      - name: Use JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the locked dependencies
        run: |
          npm ci
          npm ci --prefix apps/mobile

      - name: Verify the Android screens patch
        run: |
          set -euo pipefail
          screens=apps/mobile/node_modules/react-native-screens/android/src/main/java/com/swmansion/rnscreens
          grep -Fq 'transitioningViews.asReversed().forEach' "$screens/Screen.kt"
          grep -Fq 'view.fragment.screen.endRemovalTransition()' "$screens/ScreenStack.kt"

      - name: Typecheck the native app
        run: npm run typecheck --prefix apps/mobile

      - name: Run the native unit tests
        run: npx vitest run apps/mobile/src

      - name: Check the Expo dependency contract
        working-directory: apps/mobile
        run: npx expo-doctor

      - name: Generate the Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Make the debug APK standalone
        working-directory: apps/mobile
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'android/app/build.gradle';
          const source = fs.readFileSync(path, 'utf8');
          if (/^\s*debuggableVariants\s*=\s*\[\s*\]/m.test(source)) {
            process.exit(0);
          }
          const updated = source.replace(
            /(react\s*\{\s*\r?\n)/,
            '$1    debuggableVariants = []\n',
          );
          if (updated === source) {
            throw new Error('Could not locate the React Gradle configuration block.');
          }
          fs.writeFileSync(path, updated);
          NODE

      - name: Build arm64 debug APK
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace

      - name: Verify and name the APK
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk"

          unzip -Z1 "$apk" | grep -qx 'assets/index.android.bundle'

          architectures=$(unzip -Z1 "$apk" |
            sed -n 's#^lib/\([^/]*\)/.*#\1#p' |
            sort -u |
            paste -sd, -)
          test "$architectures" = 'arm64-v8a'

          short_sha=$(git rev-parse --short=7 HEAD)
          output="DASH-dev-${short_sha}-arm64-debug.apk"
          cp "$apk" "$output"
          sha256sum "$output" > "$output.sha256"
          echo "APK_NAME=$output" >> "$GITHUB_ENV"
          echo "Verified embedded bundle and architecture: $architectures"
          ls -lh "$output" "$output.sha256"

      - name: Upload the installable APK
        uses: actions/upload-artifact@v4
        with:
          name: dash-a55-test-${{ github.sha }}
          path: |
            apps/mobile/${{ env.APK_NAME }}
            apps/mobile/${{ env.APK_NAME }}.sha256
          if-no-files-found: error
          retention-days: 7
