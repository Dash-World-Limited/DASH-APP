name: Dependency audit keys (one-shot)

on:
  push:
    branches:
      - chatgpt/dash-next-release
    paths:
      - .github/workflows/dependency-cleanup.yml

permissions:
  contents: read

jobs:
  classify:
    name: Enumerate residual audit keys
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/dash-next-release

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json

      - name: Install
        run: |
          npm ci
          npm ci --prefix apps/mobile

      - name: Capture audit JSON
        run: |
          npm audit --json > root-audit.json || true
          npm audit --prefix apps/mobile --json > mobile-audit.json || true

      - name: Print vulnerability package keys
        run: |
          node --input-type=module -e "import fs from 'node:fs'; for (const [label,file] of [['root','root-audit.json'],['mobile','mobile-audit.json']]) { const j=JSON.parse(fs.readFileSync(file,'utf8')); const rows=Object.entries(j.vulnerabilities ?? {}).map(([name,v])=>({name,severity:v.severity,direct:v.isDirect,range:v.range,fix:typeof v.fixAvailable==='object' ? v.fixAvailable.name+'@'+v.fixAvailable.version : v.fixAvailable})); console.log(label, JSON.stringify(rows)); }"
