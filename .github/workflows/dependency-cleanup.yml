name: Dependency audit classification (one-shot)

on:
  push:
    branches:
      - chatgpt/dash-next-release
    paths:
      - .github/workflows/dependency-cleanup.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classify:
    name: Classify remaining advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out the release branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/dash-next-release

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json

      - name: Install locked dependencies
        run: |
          npm ci
          npm ci --prefix apps/mobile

      - name: Root shipped runtime audit
        continue-on-error: true
        run: npm audit --omit=dev --omit=optional --audit-level=high

      - name: Root runtime including optional integrations
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Root complete toolchain audit
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Explain remaining root chains
        continue-on-error: true
        run: |
          npm explain deepmerge-ts
          npm explain gaxios
          npm explain uuid

      - name: Native shipped runtime audit
        continue-on-error: true
        run: npm audit --prefix apps/mobile --omit=dev --omit=optional --audit-level=high

      - name: Native runtime including optional integrations
        continue-on-error: true
        run: npm audit --prefix apps/mobile --omit=dev --audit-level=high

      - name: Native complete toolchain audit
        continue-on-error: true
        run: npm audit --prefix apps/mobile --audit-level=high
