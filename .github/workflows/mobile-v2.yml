name: Native v2 Android

on:
  # Manual checkpoints prevent intermediate rebuild work from sending noisy
  # failure emails or cancelling an expensive native compile.
  workflow_dispatch:

concurrency:
  group: native-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install repository test dependencies
        run: npm ci

      - name: Install native dependencies
        run: npm ci --prefix apps/mobile

      - name: Typecheck native v2
        run: npm run typecheck --prefix apps/mobile

      - name: Prove the navigation boundary
        run: |
          test '"index.js"' = "$(node -p "JSON.stringify(require('./apps/mobile/package.json').main)")"
          ! grep -R "from 'expo-router'\|from \"expo-router\"\|from 'react-native-screens'\|from \"react-native-screens\"" apps/mobile/src/v2 apps/mobile/index.js

      - name: Generate Android project
        working-directory: apps/mobile
        env:
          APP_VARIANT: development
          NODE_ENV: production
        run: npx expo prebuild --platform android --clean --no-install

      # A release build, not a debug one. A debug APK loads its JavaScript
      # from a Metro dev server whenever it can reach one (a saved dev-server
      # address, or `adb reverse`), and only falls back to the embedded bundle.
      # On a phone that has had the old Expo Router app (same package id) run
      # against a PC's Metro, the "v2" debug APK ran the old app's JavaScript:
      # the A55 crash dump showed an RNSScreen, which v2's bundle cannot
      # create. A release build has no dev support and runs only the bundle
      # the React Native Gradle plugin embeds from index.js. Signed with the
      # template's debug key: installable for testing, not for Play.
      - name: Build A55 release APK (embedded bundle only)
        working-directory: apps/mobile/android
        env:
          NODE_ENV: production
        run: ./gradlew app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Verify APK payload
        working-directory: apps/mobile
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          unzip -l "$apk" | grep -q 'assets/index.android.bundle'
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/'
          # The embedded JavaScript is v2's: it carries v2's screen markers and
          # nothing from Expo Router / react-native-screens.
          unzip -p "$apk" assets/index.android.bundle > embedded.bundle
          if ! grep -a -q 'rider-home-v2' embedded.bundle; then echo "Embedded bundle is not v2" >&2; exit 1; fi
          if grep -a -q 'RNSScreen' embedded.bundle; then echo "Embedded bundle renders react-native-screens" >&2; exit 1; fi
          sha256sum "$apk" | tee DASH-native-v2.sha256
          cp "$apk" DASH-native-v2-arm64-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DASH-native-v2-arm64-release
          path: |
            apps/mobile/DASH-native-v2-arm64-release.apk
            apps/mobile/DASH-native-v2.sha256
          if-no-files-found: error
          retention-days: 14
