name: A55 polish full repository check

on:
  push:
    branches:
      - chatgpt/a55-rider-polish
    paths:
      - .github/workflows/a55-final-check.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked repository dependencies
        run: npm ci
      - name: Install locked native dependencies
        run: npm ci --prefix apps/mobile
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Validate Prisma schema
        run: npx prisma validate --schema packages/db/prisma/schema.prisma
      - name: Lint repository
        run: npm run lint
      - name: Typecheck repository
        run: npm run typecheck
