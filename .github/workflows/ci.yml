name: CI

on:
  push:
    # The release-candidate line runs the full gate on every push, before any
    # pull request exists; `main` is never pushed to from it.
    branches: [main, claude/playstore-readiness]
  pull_request:
    branches: [main]

# A new push to the same branch cancels the previous run. Reviewing a stale
# result is worse than having no result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # CI never touches a real service. These are the same offline adapters the
  # test harness uses, and `config.ts` refuses them in production — so a job
  # that somehow ran with NODE_ENV=production would fail loudly rather than
  # quietly pointing at something real.
  NODE_ENV: test
  DATABASE_URL: file:./ci.db
  # Fictional, high-entropy, and distinct. Committed deliberately: they unlock
  # nothing, and a shared CI secret store for values this disposable is
  # ceremony. `config.ts` rejects both a placeholder and a low-entropy secret,
  # so these have to be real-looking to pass at all.
  JWT_ACCESS_SECRET: gJ7xQ2mV9wL4pR8sT1uY6zA3bC5dE0fH-ci-access-KnMqPrSt
  JWT_REFRESH_SECRET: Zx4Vn8Bq2Wr6Ty0Ui3Op5As7Df9Gh1Jk-ci-refresh-LmNoPqRs

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs from the lockfile exactly. If package.json and the
      # lockfile disagree it fails, which is the behaviour we want in CI.
      - name: Install
        run: npm ci

      # The native app is a standalone project, outside the npm workspaces:
      # React Native requires React to match its renderer exactly, and the web
      # app pins a different release. It has its own lockfile, installed here
      # so the typecheck below can check it rather than fail it.
      - name: Install the native app
        run: npm ci --prefix apps/mobile

      # Generated explicitly rather than relying on Prisma's postinstall.
      #
      # npm 11 gates install scripts behind an `allowScripts` allowlist in
      # package.json, keyed by exact version. Node 22 ships npm 10, which has no
      # such gate — so this works either way, and does not silently break the
      # day a lockfile bump makes those pinned version keys stale.
      - name: Generate Prisma client
        run: npm run db:generate

      - name: Validate the Prisma schema
        run: npx prisma validate --schema packages/db/prisma/schema.prisma

      - name: Lint
        run: npm run lint

      # Calls the same script a developer runs locally, so the gating command
      # and the documented command cannot drift apart.
      - name: Typecheck
        run: npm run typecheck

      # `npm test` now includes the business API integration suites — orders,
      # vendor, dispatch/rider, finance/ledger, and staff authorization. They
      # need no running server: each builds a real Fastify instance and drives
      # it with inject() against a temporary SQLite file.
      - name: Test
        run: npm test

      - name: Coverage thresholds
        run: npx vitest run --coverage packages/domain

      # Rehearses the custody procedure in docs/KEY_MANAGEMENT.md against
      # synthetic keys generated in memory for the run: backup separation,
      # rotation order, and the configurations that must not boot. Reads no
      # secret store, creates no backup, and prints no key value.
      - name: Key custody drill
        run: npm run check:keys

      # Named explicitly so a failure in the money or authorization suites is
      # obvious in the job list rather than buried in a single "Test" step.
      # `npm test` above already runs these. Naming them again is deliberate:
      # if someone narrows the default test glob, this step still fails, and the
      # list documents which suites are considered non-negotiable.
      - name: Business-critical suites
        run: >
          npx vitest run
          apps/api/src/__tests__/orders.test.ts
          apps/api/src/__tests__/vendor.test.ts
          apps/api/src/__tests__/dispatch.test.ts
          apps/api/src/__tests__/finance.test.ts
          apps/api/src/__tests__/staff.test.ts
          apps/api/src/__tests__/auth.test.ts
          apps/api/src/__tests__/mfa.test.ts
          apps/api/src/__tests__/payout.test.ts
          apps/api/src/__tests__/retention.test.ts
          apps/api/src/__tests__/webhooks.test.ts
          apps/api/src/__tests__/catalog.test.ts
          apps/api/src/__tests__/config.test.ts
          apps/api/src/__tests__/secrets.test.ts
          apps/api/src/__tests__/key-rotation.test.ts

  fresh-boot:
    name: Fresh database boot and seed
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      # Proves a clone can go from nothing to a working database. This is the
      # step that catches a schema change nobody applied, or a seed that depends
      # on data a previous run left behind.
      - name: Create the database from scratch
        run: npm run db:push

      - name: Seed
        run: npm run db:seed

      # The seed asserts every ledger transaction balances before it reports
      # success, so a green seed is also a money-integrity check.
      - name: Confirm the seed produced a balanced ledger
        run: node scripts/ci-verify-seed.mjs

      # The retention job is scheduled infrastructure that does not exist yet,
      # so this is the only place it runs against a real database. Dry run:
      # CI asserts it executes and reports, never that it deletes.
      - name: Retention job dry run
        env:
          DATABASE_URL: file:./dev.db
          JWT_ACCESS_SECRET: ci-only-access-secret-not-used-for-anything-real
          JWT_REFRESH_SECRET: ci-only-refresh-secret-not-used-for-anything-real
          # No ENCRYPTION_KEY, and MFA off to match: config validates key
          # material whenever it is supplied, and a made-up value would fail
          # that check rather than exercising the job. Retention encrypts
          # nothing, so it needs no key.
          MFA_ENABLED: 'false'
        run: npm run maintenance:retention -- --dry-run

  # Production runs PostgreSQL + PostGIS and Redis, which no development
  # machine here has. This applies the whole PostgreSQL migration history to a
  # disposable database, checks `migrate status` and `migrate diff` report no
  # drift, proves PostGIS containment agrees with the in-process adapter, and
  # exercises the Redis queue. The database name follows the `dash_verify`
  # convention the script enforces, so it can never be pointed at anything
  # that holds data.
  postgres:
    name: PostgreSQL migrations, PostGIS and Redis (disposable)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: dash_verify
          POSTGRES_PASSWORD: dash_verify_ci_only
          POSTGRES_DB: dash_verify_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dash_verify -d dash_verify_ci"
          --health-interval 5s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: The PostgreSQL schema is generated from the SQLite one, and current
        run: node scripts/sync-postgres-schema.mjs --check

      - name: Migrate a disposable database from zero and check it
        env:
          PG_CHECK_URL: postgresql://dash_verify:dash_verify_ci_only@127.0.0.1:5432/dash_verify_ci
        run: npm run check:postgres

      - name: Redis queue check
        env:
          REDIS_CHECK_URL: redis://127.0.0.1:6379
        run: npm run check:redis

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      # Next's build runs its own typecheck and lint pass over the app, so this
      # catches things the workspace typecheck does not.
      - name: Build the web app
        run: npm run build --workspace @dash/web

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs history to scan commits, not just the tree.
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # High and critical fail the build. Moderate and below are reported but
      # do not block, because a transitive moderate in a dev-only tool should
      # not stop a security fix from shipping.
      - name: Audit
        run: npm audit --audit-level=high

  # ---------------------------------------------------------------------------
  # Static analysis
  #
  # CodeQL rather than a third-party scanner: it is first-party, needs no token,
  # and its TypeScript queries cover the injection and data-flow classes that
  # matter for an API. It is not a substitute for the adversarial tests in the
  # suite — it finds different things.
  # ---------------------------------------------------------------------------
  sast:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      # Required to upload results to the Security tab.
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v3

  # ---------------------------------------------------------------------------
  # Dependency review
  #
  # Pull requests only — it diffs the manifest against the base branch, so it
  # has nothing to compare on a push. Blocks a PR that introduces a dependency
  # with a known high-severity advisory, which `npm audit` would only catch
  # after the fact.
  # ---------------------------------------------------------------------------
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 10

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # ---------------------------------------------------------------------------
  # Repository hygiene
  #
  # Catches the class of mistake that gitleaks does not: a file that contains no
  # recognisable secret pattern but still should never have been committed — a
  # populated .env, a SQLite database with real rows, a build directory, an
  # upload someone tested with.
  # ---------------------------------------------------------------------------
  hygiene:
    name: No committed artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Refuse committed environment files, databases, and build output
        run: |
          set -euo pipefail

          # `.env.example` is expected and carries only placeholders.
          offenders=$(git ls-files             | grep -E '(^|/)\.env$|(^|/)\.env\.(local|production|development)$|\.db$|\.sqlite3?$|(^|/)\.next/|(^|/)dist/|(^|/)\.storage/|\.log$'             || true)

          if [ -n "$offenders" ]; then
            echo "These files must never be committed:"
            echo "$offenders"
            exit 1
          fi

          echo "No environment files, databases, build output, or logs are tracked."

      # Checks every classified secret in `.env.example` individually, by the
      # shape of its value rather than by the absence of the word "replace-me",
      # and confirms that no key file, dump, or backup is tracked.
      #
      # This replaces a `grep -q '=replace-me'` step that only looked like a
      # gate: it passed as long as *any one* of the lines it knew about still
      # matched, so a real encryption key pasted into the file sailed through
      # while the JWT line above it kept the check green. It also covered three
      # variable names out of seventeen.
      #
      # Deliberately runs with no `npm ci` before it: it is plain Node with no
      # dependencies, so it gates the repository even if an install fails.
      - name: Secret hygiene
        run: node scripts/check-secrets.mjs
