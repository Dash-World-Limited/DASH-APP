name: Mobile iOS simulator build

on:
  workflow_dispatch:
  push:
    branches: ['ios/first-native-build']
    paths:
      - 'apps/mobile/**'
      - 'packages/domain/**'
      - 'package-lock.json'
      - '.gitignore'
      - 'scripts/check-secrets.mjs'
      - '.github/workflows/mobile-ios-simulator.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/domain/**'
      - 'package-lock.json'
      - '.gitignore'
      - 'scripts/check-secrets.mjs'
      - '.github/workflows/mobile-ios-simulator.yml'

concurrency:
  group: mobile-ios-simulator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-and-build:
    name: Verify and build iOS simulator app
    runs-on: macos-26
    timeout-minutes: 90

    env:
      APP_VARIANT: staging
      NODE_ENV: production
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_MAP_STYLE_URL: ${{ vars.EXPO_PUBLIC_MAP_STYLE_URL }}

    steps:
      - name: Check out the requested commit
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json

      - name: Select and record the Apple toolchain
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          {
            xcodebuild -version
            xcrun --sdk iphonesimulator --show-sdk-version
            pod --version
            node --version
            npm --version
          } | tee "$RUNNER_TEMP/dash-ios-toolchain.txt"

      - name: Check private-file and environment hygiene
        run: node scripts/check-secrets.mjs

      - name: Install locked dependencies
        run: |
          npm ci --include=dev
          npm ci --prefix apps/mobile --include=dev

      - name: Compile the staging API origin into the native bundle
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const value = (process.env.EXPO_PUBLIC_API_URL ?? '').trim() || null;
          writeFileSync(
            'apps/mobile/src/api/buildConfig.ts',
            `/** Generated by CI. Do not commit this workspace copy. */\nexport const COMPILED_API_URL: string | null = ${JSON.stringify(value)};\n`,
          );
          NODE

      - name: Typecheck the native app
        run: npm run typecheck --prefix apps/mobile

      - name: Lint the native app
        run: npx eslint apps/mobile

      - name: Run native unit tests
        env:
          NODE_ENV: test
        run: npx vitest run apps/mobile

      - name: Check Expo dependency contract
        working-directory: apps/mobile
        run: npm run doctor

      - name: Generate the iOS project
        working-directory: apps/mobile
        run: npm run ios:generate

      - name: Verify the iOS configuration contract
        working-directory: apps/mobile
        run: |
          npm run ios:verify-config
          git diff --exit-code -- package.json package-lock.json

      - name: Boot an available iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > "$RUNNER_TEMP/simulators.json"
          device=$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/simulators.json','utf8'));const d=Object.entries(j.devices).filter(([r])=>r.includes('iOS')).flatMap(([,d])=>d).find(d=>d.isAvailable&&d.name.startsWith('iPhone'));if(!d)throw Error('No available iPhone simulator');process.stdout.write(d.udid)")
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          echo "IOS_SIMULATOR_ID=$device" >> "$GITHUB_ENV"

      - name: Install CocoaPods
        working-directory: apps/mobile/ios
        run: |
          pod install
          cp Podfile.lock "$RUNNER_TEMP/dash-ios-Podfile.lock"

      - name: Build unsigned iOS simulator app
        working-directory: apps/mobile/ios
        shell: bash
        run: |
          set -euo pipefail
          workspace=$(find . -maxdepth 1 -name '*.xcworkspace' -print -quit)
          if [ -z "$workspace" ]; then
            echo 'No Xcode workspace was generated.' >&2
            exit 1
          fi

          project=$(find . -maxdepth 1 -name '*.xcodeproj' -print -quit)
          scheme=$(basename "$project" .xcodeproj)
          xcodebuild -workspace "$workspace" -list -json > "$RUNNER_TEMP/xcode-list.json"
          echo "Building scheme: $scheme"

          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "id=$IOS_SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/dash-ios-derived" \
            -resultBundlePath "$RUNNER_TEMP/dash-ios-build.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/dash-ios-build.log"

          app=$(find "$RUNNER_TEMP/dash-ios-derived/Build/Products/Release-iphonesimulator" -maxdepth 1 -name '*.app' -print -quit)
          if [ -z "$app" ]; then
            echo 'The iOS simulator .app was not produced.' >&2
            exit 1
          fi

          short_sha=$(git rev-parse --short=7 HEAD)
          output="$RUNNER_TEMP/DASH-iOS-${short_sha}-simulator.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$output"
          shasum -a 256 "$output" > "$output.sha256"
          echo "IOS_SIMULATOR_ZIP=$output" >> "$GITHUB_ENV"
          echo "IOS_SIMULATOR_SHA=$output.sha256" >> "$GITHUB_ENV"
          echo "IOS_SIMULATOR_APP=$app" >> "$GITHUB_ENV"

      - name: Launch the release app and capture startup
        shell: bash
        run: |
          set -euo pipefail
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$IOS_SIMULATOR_APP/Info.plist")
          xcrun simctl install "$IOS_SIMULATOR_ID" "$IOS_SIMULATOR_APP"
          launch=$(xcrun simctl launch "$IOS_SIMULATOR_ID" "$bundle_id")
          echo "$launch"
          pid=$(echo "$launch" | awk '{print $NF}')
          sleep 15
          kill -0 "$pid"
          xcrun simctl io "$IOS_SIMULATOR_ID" screenshot "$RUNNER_TEMP/dash-ios-startup.png"
          xcrun simctl spawn "$IOS_SIMULATOR_ID" log show --last 2m --style compact --predicate "processIdentifier == $pid" > "$RUNNER_TEMP/dash-ios-startup.log"

      - name: Upload build and startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dash-ios-diagnostics-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dash-ios-build.log
            ${{ runner.temp }}/dash-ios-build.xcresult
            ${{ runner.temp }}/dash-ios-startup.png
            ${{ runner.temp }}/dash-ios-startup.log
            ${{ runner.temp }}/xcode-list.json
            ${{ runner.temp }}/dash-ios-toolchain.txt
            ${{ runner.temp }}/dash-ios-Podfile.lock
          if-no-files-found: warn
          retention-days: 7

      - name: Verify signed-out navigation on the iPhone simulator
        shell: bash
        timeout-minutes: 15
        env:
          MAESTRO_CLI_NO_ANALYTICS: '1'
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.11.0/maestro.zip \
            --output "$RUNNER_TEMP/maestro.zip"
          echo "5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a  $RUNNER_TEMP/maestro.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-dist"
          mkdir -p "$RUNNER_TEMP/dash-ios-ui"
          "$RUNNER_TEMP/maestro-dist/maestro/bin/maestro" --device "$IOS_SIMULATOR_ID" test \
            --format JUNIT --output "$RUNNER_TEMP/dash-ios-ui/results.xml" \
            --debug-output "$RUNNER_TEMP/dash-ios-ui/debug" \
            -e OUTPUT_DIR="$RUNNER_TEMP/dash-ios-ui" \
            apps/mobile/e2e/ios-startup.yaml

      - name: Upload native navigation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dash-ios-navigation-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dash-ios-ui
          if-no-files-found: warn
          retention-days: 7

      - name: Upload iOS simulator artifact
        if: always() && env.IOS_SIMULATOR_ZIP != ''
        uses: actions/upload-artifact@v4
        with:
          name: dash-ios-simulator-${{ github.sha }}
          path: |
            ${{ env.IOS_SIMULATOR_ZIP }}
            ${{ env.IOS_SIMULATOR_SHA }}
          if-no-files-found: error
          retention-days: 7
