name: Mobile iOS simulator build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/domain/**'
      - '.github/workflows/mobile-ios-simulator.yml'

concurrency:
  group: mobile-ios-simulator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-and-build:
    name: Verify and build iOS simulator app
    runs-on: macos-15
    timeout-minutes: 90

    env:
      APP_VARIANT: staging
      NODE_ENV: production
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_MAP_STYLE_URL: ${{ vars.EXPO_PUBLIC_MAP_STYLE_URL }}

    steps:
      - name: Check out the requested commit
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json

      - name: Install locked dependencies
        run: |
          npm ci --include=dev
          npm ci --prefix apps/mobile --include=dev

      - name: Compile the staging API origin into the native bundle
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const value = (process.env.EXPO_PUBLIC_API_URL ?? '').trim() || null;
          writeFileSync(
            'apps/mobile/src/api/buildConfig.ts',
            `/** Generated by CI. Do not commit this workspace copy. */\nexport const COMPILED_API_URL: string | null = ${JSON.stringify(value)};\n`,
          );
          NODE

      - name: Typecheck the native app
        run: npm run typecheck --prefix apps/mobile

      - name: Run native unit tests
        env:
          NODE_ENV: test
        run: npx vitest run apps/mobile/src

      - name: Check Expo dependency contract
        working-directory: apps/mobile
        run: npx expo-doctor

      - name: Generate the iOS project
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        working-directory: apps/mobile/ios
        run: pod install

      - name: Build unsigned iOS simulator app
        working-directory: apps/mobile/ios
        shell: bash
        run: |
          set -euo pipefail
          workspace=$(find . -maxdepth 1 -name '*.xcworkspace' -print -quit)
          if [ -z "$workspace" ]; then
            echo 'No Xcode workspace was generated.' >&2
            exit 1
          fi

          xcodebuild -workspace "$workspace" -list -json > "$RUNNER_TEMP/xcode-list.json"
          scheme=$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/xcode-list.json','utf8'));const s=j.workspace?.schemes?.[0];if(!s)process.exit(1);process.stdout.write(s)")
          echo "Building scheme: $scheme"

          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath "$RUNNER_TEMP/dash-ios-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

          app=$(find "$RUNNER_TEMP/dash-ios-derived/Build/Products/Release-iphonesimulator" -maxdepth 1 -name '*.app' -print -quit)
          if [ -z "$app" ]; then
            echo 'The iOS simulator .app was not produced.' >&2
            exit 1
          fi

          short_sha=$(git rev-parse --short=7 HEAD)
          output="$RUNNER_TEMP/DASH-iOS-${short_sha}-simulator.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$output"
          shasum -a 256 "$output" > "$output.sha256"
          echo "IOS_SIMULATOR_ZIP=$output" >> "$GITHUB_ENV"
          echo "IOS_SIMULATOR_SHA=$output.sha256" >> "$GITHUB_ENV"

      - name: Upload iOS simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: dash-ios-simulator-${{ github.sha }}
          path: |
            ${{ env.IOS_SIMULATOR_ZIP }}
            ${{ env.IOS_SIMULATOR_SHA }}
          if-no-files-found: error
          retention-days: 7
