appId: com.dashworldng.dash.staging
name: iOS startup and signed-out navigation
---
# No credentials, API mutations or permission grants. Exercise the real
# release binary through the same accessible controls a person uses.
- launchApp:
    clearState: true
    permissions:
      all: deny
- extendedWaitUntil:
    visible: "Everything around you, one DASH away."
    timeout: 60000
- takeScreenshot: welcome
- tapOn: "Sign in"
- assertVisible: "Welcome back"
- takeScreenshot: signin
- tapOn: "Back"
- assertVisible: "Everything around you, one DASH away."
- tapOn: "Create account"
- assertVisible:
    id: "register-v2"
- assertVisible: "Full name"
- takeScreenshot: register
- tapOn: "Go back"
- assertVisible: "Everything around you, one DASH away."
